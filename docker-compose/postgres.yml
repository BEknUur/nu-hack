services:
  postgres:
    image: postgres:15-alpine
    container_name: decentra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ALEM_POSTGRES_USER}
      POSTGRES_PASSWORD: ${ALEM_POSTGRES_PASSWORD}
      POSTGRES_DB: ${ALEM_POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ALEM_POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
