services:
  backend:
    build:
      context: ..
      dockerfile: dockerfiles/backend.Dockerfile
    container_name: decentra-backend
    restart: unless-stopped
    env_file: ../envs/${ENV:-dev}.env
    ports:
      - "8003:8000"

  frontend:
    build:
      context: ..
      dockerfile: dockerfiles/frontend.Dockerfile
      args:
        VITE_SHADEMAP_API_KEY: ${VITE_SHADEMAP_API_KEY:-}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-}
    container_name: decentra-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"

  nginx:
    build:
      context: ..
      dockerfile: dockerfiles/edge-nginx.Dockerfile
      args:
        VITE_SHADEMAP_API_KEY: ${VITE_SHADEMAP_API_KEY:-}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-}
    container_name: decentra-nginx
    restart: unless-stopped
    profiles: ["edge"]
    depends_on:
      - backend
    volumes:
      - ../certbot/conf:/etc/letsencrypt:ro
      - ../certbot/www:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"

  certbot:
    image: certbot/certbot:latest
    profiles: ["certbot"]
    ports:
      - "80:80"
    volumes:
      - ../certbot/conf:/etc/letsencrypt
      - ../certbot/www:/var/www/certbot
